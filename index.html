<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My Mapbox Map</title>
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.10.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.10.0/mapbox-gl.js"></script>
<style>
body { margin: 0; padding: 0; }
#map { position: absolute; top: 0; bottom: 0; width: 100%; }
</style>
</head>
<body>
<div id="map"></div>
<script>
    // TO MAKE THE MAP APPEAR YOU MUST
    // ADD YOUR ACCESS TOKEN FROM
    // https://account.mapbox.com
    mapboxgl.accessToken = 'pk.eyJ1Ijoiam1hcnZpbjEzIiwiYSI6ImNsenNmdDQxbTFjcGoybHB3N3VmazF2Z3cifQ.hZH_APFQiHDmWvQ2TpqE6w';
    const map = new mapboxgl.Map({
        container: 'map', // container ID
        style: 'mapbox://styles/jmarvin13/cm8thvrk300nb01sd79pxhaip', // style URL
        center: [-74.5, 40], // starting position [lng, lat]
        zoom: 9 // starting zoom
    });
</script>
</body>
